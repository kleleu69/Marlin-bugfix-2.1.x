#
# Marlin Firmware
# Test: STM32G0B1RE_btt/config-02.ini
#
# Ender-2 Pro BIQU runtime calibration - SKR Mini E3 3.0
#

[config:base]
ini_use_config                           = example/Creality/Ender-3/BigTreeTech SKR Mini E3 3.0

x_bed_size                               = 165
y_bed_size                               = 165
default_axis_steps_per_unit              = { 80, 80, 400, 932 }
editable_steps_per_unit                  = on
eeprom_settings                          = on
no_home_offsets                          = off
biqu_microprobe_v2                       = on
use_probe_for_z_homing                   = on
nozzle_to_probe_offset                   = { 9, -29, -2.3 }
probe_offset_xmin                        = -50
probe_offset_xmax                        = 50
probe_offset_ymin                        = -50
probe_offset_ymax                        = 50
probe_offset_zmin                        = -5
probe_offset_zmax                        = 3
z_safe_homing                            = on
z_safe_homing_x_point                    = 82.5
z_safe_homing_y_point                    = 82.5
babystepping                             = on
babystep_always_available                = on
babystep_zprobe_offset                   = on
babystep_millimeter_units                = on
babystep_multiplicator_z                  = 0.01
