name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Download board and display dependencies without compiling
        run: |
          python -m platformio pkg install --project-dir "$GITHUB_WORKSPACE" --environment STM32G0B1RE_btt --no-save
          python -m platformio pkg install --project-dir "$GITHUB_WORKSPACE" --environment STM32G0B1RE_btt --library 'marlinfirmware/U8glib-HAL@0.5.5' --no-save
          python -m platformio pkg list --project-dir "$GITHUB_WORKSPACE" --environment STM32G0B1RE_btt
